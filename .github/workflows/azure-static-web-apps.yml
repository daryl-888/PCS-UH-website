name: Azure Static Web Apps CI/CD

# Builds and deploys on every push to main, and creates a throwaway preview
# environment for each pull request. If you created the Static Web App
# through the Azure Portal's GitHub integration, Azure already committed a
# version of this file with your deployment token wired in as
# AZURE_STATIC_WEB_APPS_API_TOKEN_<random> — reconcile the two rather than
# keeping both.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
        env:
          # Add any build-time secrets the app needs here (see README —
          # "Environment variables" under the Azure deploy guide). They also
          # need to be set as Application settings on the Static Web App
          # resource itself for the request-time (API route) side.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
